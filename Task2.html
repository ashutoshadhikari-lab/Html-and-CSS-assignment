<!DOCTYPE html>
<html>
<head>
    <title>Task 2</title>
    <style>
        /* Div element selector for common properties */
        div {
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
            height: 80px;
            width: 200px;
        }

        /* Class selector for second div */
        .second-div {
            background-color: lightblue;
            color: darkblue;
        }

        /* ID selector for third div */
        #third-div {
            background-color: lightgreen;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div>First Div</div>
    <div class="second-div">Second Div</div>
    <div id="third-div">Third Div</div>

</body>
</html>
